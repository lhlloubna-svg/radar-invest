<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1726">
<title>Radar Invest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0b1726;--card:#13243a;--line:#1f3550;--tx:#e8eef6;--mut:#8ea3bd;--buy:#2fd18b;--wait:#f5c451;--watch:#5aa9ff;--avoid:#ff6b6b;--hold:#b18cff}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,Roboto,sans-serif}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header img{width:34px;height:34px;border-radius:9px}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap}
.upd{font-size:11px;color:var(--mut);text-align:right}
button.ref{background:none;border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:6px 9px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:20px 2px 6px}
.next{border-color:var(--buy);box-shadow:0 0 0 1px var(--buy) inset}
.next .lbl{font-size:12px;color:var(--buy);font-weight:700;letter-spacing:.08em}
.next .tx{font-size:17px;font-weight:600;margin-top:4px}
.mood{display:flex;gap:12px;align-items:center}
.gauge{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.mood b{display:block}.mood p{margin:3px 0 0;color:var(--mut);font-size:13px}
.pulse{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pulse div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px}
.pulse small{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse b{font-size:14px}.up{color:var(--buy)}.dn{color:var(--avoid)}
.todo label{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.todo label:first-of-type{border-top:0}
.todo input{width:22px;height:22px;flex:none;accent-color:var(--buy);margin-top:1px}
.todo .t{color:var(--mut);font-size:12px;font-weight:700;display:block}
.todo .done span{text-decoration:line-through;color:var(--mut)}
.focus{font-size:13px;color:var(--mut);margin-bottom:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;font-size:13px}
.tabs button.on{background:var(--tx);color:var(--bg)}
.idea .top{display:flex;align-items:center;gap:8px}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;color:#0b1726;flex:none}
.idea .nm{font-weight:600;flex:1;min-width:0}
.idea .tk{color:var(--mut);font-size:12px}
.idea .trg{margin:8px 0 4px;font-weight:600}
.idea .st{color:var(--mut);font-size:13px;margin:0}
.why{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:2px 7px;flex:none}
.ag div{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ag div:first-child{border-top:0}.ag b{flex:none;width:58px;color:var(--mut);font-size:13px}
a.full{display:block;text-align:center;background:var(--buy);color:#06241a;font-weight:700;padding:13px;border-radius:13px;text-decoration:none;margin-top:18px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:14px}
.off{color:var(--wait);font-size:12px}
</style>
</head>
<body>
<main>
  <header>
    <img src="icons/icon-192.png" alt="">
    <h1>Radar Invest</h1>
    <div class="upd"><span id="upd">Loading…</span><br><span id="off" class="off" hidden>offline copy</span></div>
    <button class="ref" id="ref" aria-label="Refresh">↻</button>
  </header>

  <div class="card next" id="nextCard" hidden><div class="lbl">NEXT</div><div class="tx" id="next"></div></div>

  <div class="card mood" id="moodCard"><div class="gauge" id="gauge"></div><div><b id="regLabel"></b><p id="regSum"></p></div></div>
  <div class="pulse" id="pulse"></div>

  <h2>Today</h2>
  <div class="card todo" id="todo"></div>

  <h2>Ideas</h2>
  <div class="tabs" id="tabs"></div>
  <div id="cards"></div>

  <h2>This week</h2>
  <div class="card ag" id="agenda"></div>

  <a class="full" href="https://claude.ai/artifact/Q8zPqxwQvg3oWdndgrTqeU">Open full Radar (positions, lab, Ask Claude)</a>
  <p class="foot">Updated by your Radar agents. Not financial advice: you place every order yourself.</p>
</main>
<script>
var COLORS={buy:'var(--buy)',wait:'var(--wait)',watch:'var(--watch)',avoid:'var(--avoid)',hold:'var(--hold)'};
var LABEL={buy:'BUY',wait:'WAIT',watch:'WATCH',avoid:'AVOID',hold:'HOLD'};
var D=null, filter='all';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function doneMap(){var m=store('done-'+(D.todo&&D.todo.date))||{};((D.todo||{}).items||[]).forEach(function(i){if(i.done&&!(i.id in m))m[i.id]=true});return m}
function render(){
  document.getElementById('upd').textContent=D.updatedLabel||'';
  var r=D.regime||{}, g=document.getElementById('gauge'), s=+r.score||0;
  var col=s<30?'var(--avoid)':s<50?'var(--wait)':'var(--buy)';
  g.textContent=s; g.style.border='4px solid '+col; g.style.color=col;
  document.getElementById('regLabel').textContent=r.label||'';
  document.getElementById('regSum').textContent=D.brief||r.summary||'';
  document.getElementById('pulse').innerHTML=(D.pulse||[]).map(function(p){
    var c=p.change, cls=c==null?'':((c>0)!==(!!p.invert)?'up':'dn');
    return '<div><small>'+esc(p.name)+'</small><b>'+esc(p.value)+'</b> <span class="'+cls+'">'+(c==null?'':(c>0?'+':'')+c+'%')+'</span></div>'}).join('');
  var t=D.todo||{items:[]}, dm=doneMap();
  document.getElementById('todo').innerHTML=(t.focus?'<div class="focus">'+esc(t.focus)+'</div>':'')+
    (t.items.length?t.items.map(function(i){var d=!!dm[i.id];
      return '<label class="'+(d?'done':'')+'"><input type="checkbox" data-id="'+esc(i.id)+'"'+(d?' checked':'')+'><span>'+(i.time?'<span class="t">'+esc(i.time)+' Dubai</span>':'')+esc(i.text)+'</span></label>'}).join(''):'<span class="focus">Nothing to do today.</span>');
  var nx=t.items.filter(function(i){return !dm[i.id]})[0];
  document.getElementById('nextCard').hidden=!nx;
  if(nx)document.getElementById('next').textContent=(nx.time?nx.time+' · ':'')+nx.text;
  var calls=['all','buy','wait','hold','watch','avoid'].filter(function(c){return c==='all'||(D.cards||[]).some(function(x){return x.call===c})});
  document.getElementById('tabs').innerHTML=calls.map(function(c){return '<button data-f="'+c+'" class="'+(c===filter?'on':'')+'">'+(c==='all'?'All':LABEL[c])+'</button>'}).join('');
  document.getElementById('cards').innerHTML=(D.cards||[]).filter(function(c){return filter==='all'||c.call===filter}).map(function(c){
    return '<div class="card idea"><div class="top"><span class="pill" style="background:'+(COLORS[c.call]||'#999')+'">'+(LABEL[c.call]||c.call)+'</span><span class="nm">'+esc(c.name)+' <span class="tk">'+esc(c.ticker)+'</span></span>'+(c.why?'<span class="why">'+esc(c.why)+'</span>':'')+'</div><p class="trg">'+esc(c.trigger)+'</p><p class="st">'+esc(c.story)+'</p></div>'}).join('');
  document.getElementById('agenda').innerHTML=(D.agenda||[]).map(function(a){return '<div><b>'+esc(a.date)+'</b><span>'+esc(a.event)+'</span></div>'}).join('');
}
document.addEventListener('change',function(e){if(e.target.dataset.id){var m=doneMap();m[e.target.dataset.id]=e.target.checked;store('done-'+D.todo.date,m);render()}});
document.addEventListener('click',function(e){var f=e.target.dataset&&e.target.dataset.f;if(f){filter=f;render()}});
function load(){
  fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})
  .then(function(d){D=d;store('last',d);document.getElementById('off').hidden=true;render()})
  .catch(function(){var d=store('last');if(d){D=d;document.getElementById('off').hidden=false;render()}else document.getElementById('upd').textContent='No connection'});
}
document.getElementById('ref').onclick=load;
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
